<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ไม่พบหน้าที่ต้องการ (404) | SMMS แจ้งซ่อม</title>
<!-- =========================================================================
  DS UI Kit : error.html (error archetype: NO sidebar, NO topbar, NO footer)

  One standalone page for every HTTP error the user can meet:
    403  ไม่มีสิทธิ์เข้าถึง      icon lock            accent red
    404  ไม่พบหน้าที่ต้องการ     icon search          accent blue (default)
    419  เซสชันหมดอายุ           icon clock           accent orange
    500  ระบบขัดข้อง              icon alert-triangle  accent red
    503  ปิดปรับปรุงระบบ          icon gear            accent orange
  In this template the PAGE SCRIPT at the end of the body swaps the texts
  from ?code= (403|404|419|500|503, default 404) so reviewers can see every
  variant from one file. In a real system the server renders the variant
  directly and the PAGE SCRIPT is deleted:
    Plain PHP : set http_response_code(404) and include one partial per code
                (or one partial fed by an array like VARIANTS below).
    Laravel   : resources/views/errors/403|404|419|500|503.blade.php, each a
                copy of this body with its own texts; Laravel picks the file
                by status code automatically (419 = CSRF token / session
                expired, 503 = php artisan down).
  Accent colour of the icon circle: set --ds-accent on .ds-error__icon,
  e.g. style="--ds-accent:var(--ds-red)" (no attribute = blue).
  The reference id / time line (ds-error__meta) helps the help-desk find the
  log entry: print the server request id there, never a stack trace.

  Same <head> as login.html (Kanit, ds-ui.css, ds-ui.js). data-ds-back is
  generic in ds-ui.js: history.back(), or dashboard.html when there is no
  history (page opened in a new tab).
  These comments intentionally contain no PHP tags and no Blade directives,
  so the file stays inert when copied into a .php or .blade.php file.
========================================================================== -->
<!-- Kanit web font: the kit standard font (same request as the original). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap">
<link rel="stylesheet" href="../assets/ds-ui.css">
<!-- ds-ui.js stays in <head> WITHOUT defer/async: it applies the saved theme
     before first paint, then injects the icon sprite and wires data-ds-back. -->
<script src="../assets/ds-ui.js"></script>
</head>
<!-- class="ds-body" is part of the shell: margin 0 + page background. -->
<body class="ds-body">

<!-- ===== ERROR LAYOUT =====
     ds-error = full-height, centred on --ds-bg; ds-error__card = one panel.
     No skip link: the brand link and the two buttons are the only
     focusable elements. -->
<main class="ds-error" id="ds-main">
  <div class="ds-error__card">

    <!-- Brand: small logo + system name, back to the dashboard -->
    <div class="ds-error__brand">
      <a href="dashboard.html">
        <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true">
          <path style="fill:var(--ds-logo)" d="M20.5 2h7l1.1 5.4 3.2 1.3 4.6-3 5 4.9-3.1 4.6 1.3 3.2L45 19.5v7l-5.4 1.1-1.3 3.2 3.1 4.6-5 5-4.6-3.1-3.2 1.3L27.5 44h-7l-1.1-5.4-3.2-1.3-4.6 3.1-5-5 3.1-4.6-1.3-3.2L3 26.5v-7l5.4-1.1 1.3-3.2-3.1-4.6 5-4.9 4.6 3 3.2-1.3z"/>
          <circle style="fill:var(--ds-navy-950)" cx="24" cy="23" r="10.5"/>
          <path style="stroke:var(--ds-on-color)" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M18.5 23.5l4 4 7.5-8.5"/>
        </svg>
        <span>SMMS แจ้งซ่อม</span>
      </a>
    </div>

    <!-- Icon circle (tint = --ds-accent), status code, title, explanation -->
    <div class="ds-error__icon" id="errIcon"><svg class="ds-ic" aria-hidden="true"><use href="#ds-i-search"></use></svg></div>
    <p class="ds-error__code ds-num" id="errCode">404</p>
    <h1 class="ds-error__title" id="errTitle">ไม่พบหน้าที่ต้องการ</h1>
    <p class="ds-error__text" id="errText">หน้าที่คุณเรียกอาจถูกย้าย ลบ หรือพิมพ์ที่อยู่ไม่ถูกต้อง กรุณาตรวจสอบลิงก์อีกครั้ง หรือกลับไปที่หน้าหลักเพื่อค้นหาใบแจ้งซ่อมที่ต้องการ</p>

    <!-- Actions: primary = a safe place to go, ghost = history.back() -->
    <div class="ds-error__actions">
      <a class="ds-btn ds-btn--lg" href="dashboard.html" id="errPrimary">กลับหน้าหลัก</a>
      <button type="button" class="ds-btn ds-btn--ghost ds-btn--lg" data-ds-back>ย้อนกลับ</button>
    </div>

    <!-- Reference for the help-desk (server request id + time) -->
    <p class="ds-error__meta">รหัสอ้างอิง: <span class="ds-num" id="errRef">REQ-25051510240042</span> · เวลา <span class="ds-num" id="errTime">15/05/2568 10:24 น.</span></p>

    <!-- TEMPLATE ONLY (delete in a real system): switch between variants -->
    <p class="ds-error__meta" id="errSwitch">ดูหน้าอื่น:
      <a href="error.html?code=403">403</a> ·
      <a href="error.html?code=404">404</a> ·
      <a href="error.html?code=419">419</a> ·
      <a href="error.html?code=500">500</a> ·
      <a href="error.html?code=503">503</a>
    </p>
  </div>
</main>
<!-- ===== /ERROR LAYOUT ===== -->

<!-- ===== PAGE SCRIPT (error.html only; delete in a real system) ===== -->
<script>
/* PAGE SCRIPT (ตัวอย่าง) — แทนที่ด้วยข้อมูลจากเซิร์ฟเวอร์
   Picks the variant from ?code= (default 404), fills the texts, the icon,
   the accent colour and the primary action, and marks the current code in
   the "ดูหน้าอื่น" row with aria-current. Runs at the end of <body>, so the
   elements exist; DS.* helpers come from ds-ui.js in <head>. */
(function () {
  'use strict';
  var VARIANTS = {
    403: {
      icon: 'lock', accent: '--ds-red',
      title: 'ไม่มีสิทธิ์เข้าถึง',
      text: 'บัญชีของคุณยังไม่ได้รับสิทธิ์ใช้งานหน้านี้ หากจำเป็นต้องใช้งาน กรุณาติดต่อผู้ดูแลระบบหรือหัวหน้างานเพื่อขอเพิ่มสิทธิ์',
      action: ['กลับหน้าหลัก', 'dashboard.html']
    },
    404: {
      icon: 'search', accent: '',
      title: 'ไม่พบหน้าที่ต้องการ',
      text: 'หน้าที่คุณเรียกอาจถูกย้าย ลบ หรือพิมพ์ที่อยู่ไม่ถูกต้อง กรุณาตรวจสอบลิงก์อีกครั้ง หรือกลับไปที่หน้าหลักเพื่อค้นหาใบแจ้งซ่อมที่ต้องการ',
      action: ['กลับหน้าหลัก', 'dashboard.html']
    },
    419: {
      icon: 'clock', accent: '--ds-orange',
      title: 'เซสชันหมดอายุ',
      text: 'คุณไม่ได้ใช้งานระบบเป็นเวลานาน เพื่อความปลอดภัยระบบจึงออกจากระบบให้อัตโนมัติ กรุณาเข้าสู่ระบบอีกครั้ง ข้อมูลที่ยังไม่ได้บันทึกอาจต้องกรอกใหม่',
      action: ['เข้าสู่ระบบอีกครั้ง', 'login.html']
    },
    500: {
      icon: 'alert-triangle', accent: '--ds-red',
      title: 'ระบบขัดข้อง',
      text: 'เกิดข้อผิดพลาดภายในระบบ ทีมผู้ดูแลได้รับแจ้งแล้ว กรุณาลองใหม่อีกครั้งในอีกสักครู่ หากยังพบปัญหา โปรดแจ้งรหัสอ้างอิงด้านล่างกับผู้ดูแลระบบ',
      action: ['กลับหน้าหลัก', 'dashboard.html']
    },
    503: {
      icon: 'gear', accent: '--ds-orange',
      title: 'ปิดปรับปรุงระบบ',
      text: 'ระบบปิดปรับปรุงชั่วคราวตั้งแต่ 20/05/2568 เวลา 18:00 น. และคาดว่าจะเปิดให้บริการอีกครั้งภายในเวลา 21:00 น. ขออภัยในความไม่สะดวก',
      action: ['ลองใหม่อีกครั้ง', 'error.html?code=503']
    }
  };
  var m = /[?&]code=(\d{3})/.exec(location.search);
  var code = m && VARIANTS[m[1]] ? m[1] : '404';
  var v = VARIANTS[code];
  function $(id) { return document.getElementById(id); }

  $('errCode').textContent = code;
  $('errTitle').textContent = v.title;
  $('errText').textContent = v.text;
  document.title = v.title + ' (' + code + ') | SMMS แจ้งซ่อม';

  var icon = $('errIcon');
  icon.querySelector('use').setAttribute('href', '#ds-i-' + v.icon);
  if (v.accent) icon.style.setProperty('--ds-accent', 'var(' + v.accent + ')');

  var primary = $('errPrimary');
  primary.textContent = v.action[0];
  primary.setAttribute('href', v.action[1]);

  /* reference id + time: in a real system both come from the server */
  var now = new Date();
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  $('errRef').textContent = 'REQ-' + String(now.getFullYear()).slice(2) + p2(now.getMonth() + 1) + p2(now.getDate()) +
    p2(now.getHours()) + p2(now.getMinutes()) + p2(now.getSeconds()) + String(now.getMilliseconds() + 100).slice(-2);
  $('errTime').textContent = (window.DS && DS.fmtDate ? DS.fmtDate(now) : '') + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ' น.';

  Array.prototype.forEach.call($('errSwitch').querySelectorAll('a'), function (a) {
    if (a.textContent.trim() === code) a.setAttribute('aria-current', 'page');
  });
})();
</script>
</body>
</html>
